  # Insurance Service - Full
  insurance-service:
    build:
      context: .
      dockerfile: packages/backend/insurance-service/Dockerfile
    container_name: medinext-insurance-service
    ports:
      - "3012:3012"
    environment:
      - NODE_ENV=production
      - PORT=3012
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=medinext
      - DB_PASSWORD=medinext_secret
      - DB_NAME=medinext
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medinext-network
    restart: unless-stopped
    profiles:
      - full

  # Emergency Service - Full
  emergency-service:
    build:
      context: .
      dockerfile: packages/backend/emergency-service/Dockerfile
    container_name: medinext-emergency-service
    ports:
      - "3013:3013"
    environment:
      - NODE_ENV=production
      - PORT=3013
      - DB_HOST=postgres
      - DB_PORT=5432
