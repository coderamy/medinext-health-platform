  # Organ Donor Service - Full
  organ-donor-service:
    build:
      context: .
      dockerfile: packages/backend/organ-donor-service/Dockerfile
    container_name: medinext-organ-donor-service
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=medinext
      - DB_PASSWORD=medinext_secret
      - DB_NAME=medinext
    depends_on:
      postgres:
        condition: service_healthy
