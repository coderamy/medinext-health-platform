  # Notification Service - Full
  notification-service:
    build:
      context: .
      dockerfile: packages/backend/notification-service/Dockerfile
    container_name: medinext-notification-service
    ports:
      - "3015:3015"
    environment:
      - NODE_ENV=production
      - PORT=3015
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medinext-network
    restart: unless-stopped
    profiles:
      - full

  # ============================================================
  # FRONTEND SERVICE
  # React frontend with all services
  # ============================================================
  
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: medinext-frontend
    ports:
      - "5173:5173"
      - "80:80"
    environment:
      - VITE_API_URL=http://api-gateway:3000
    depends_on:
      - api-gateway
    networks:
      - medinext-network
    restart: unless-stopped
    profiles:
      - core
      - extended
      - full

volumes:
  postgres_data:
  redis_data:

networks:
  medinext-network:
    driver: bridge
